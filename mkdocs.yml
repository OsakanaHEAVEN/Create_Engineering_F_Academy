site_name: Create Engineering F 技術講義
site_url: https://osakanaheaven.github.io/Create_Engineering_F_Academy/
site_description: 実際のPythonファイル、関数の呼び出し、データの受け渡しから学ぶ日本語の技術講義
repo_name: 教材リポジトリ
repo_url: https://github.com/OsakanaHEAVEN/Create_Engineering_F_Academy
edit_uri: ""
use_directory_urls: false
theme:
  name: material
  language: ja
  font: false
  icon:
    logo: material/book-open-page-variant-outline
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: {icon: material/weather-night, name: ダークモードに切り替え}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: {icon: material/weather-sunny, name: ライトモードに切り替え}
plugins:
  - search:
      lang: [ja, en]
markdown_extensions:
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
extra_javascript: [assets/literal-search.js]
extra_css: [figures/reading.css]
nav:
  - 講義本編:
      - 1　技術概論: index.md
      - 2　起動とイベント: course/operate.md
      - 3　一枚の画像とSQLite: course/remember.md
      - 4　データ型と契約: course/meaning.md
      - 5　非同期処理と更新順序: course/time.md
      - 6　検索・共有と変更の影響: course/share.md
  - 実装ノート:
      - 画像ファイルとSQLite: lessons/03-storage.md
      - 既存DBの移行: reference/schema.md
      - Pythonの実行入口: lessons/01-python.md
      - Qtの起動と終了: lessons/02-boot.md
      - 契約とFake: lessons/04-contract.md
      - 音声・画像とAI付加: lessons/06-ai.md
      - 分類と検索: lessons/08-album.md
      - 連写と音声の切り出し: lessons/05-capture.md
      - ジョブと競合: lessons/07-jobs.md
      - 承認付きHTTP共有: lessons/09-sharing.md
      - 三つの経路の追跡表: lessons/10-trace.md
      - テストと仕様変更の実例: lessons/11-assessment.md
  - 資料室:
      - 実行環境: reference/setup.md
      - Pythonファイルの地図: reference/files.md
      - 関数の読解索引: reference/code.md
      - 用語集: reference/glossary.md
      - 調査台帳: reference/audit.md
      - 改訂と公開: reference/update.md
